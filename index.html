<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Verification</title>

<style>
    body {
        margin: 0;
        padding: 20px;
        background: #eef0f3;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    .page-container {
        max-width: 1100px;
        margin: auto;
    }

    .header {
        text-align: center;
        margin-bottom: 20px;
    }

    .header h1 {
        margin: 0;
        font-weight: 700;
        color: #444;
        font-size: clamp(20px, 4vw, 32px);
    }

    .card-box {
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        padding: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
    }

    .left-panel, .right-panel {
        flex: 1 1 300px;
    }

    .left-panel {
        text-align: center;
    }

    .left-panel img {
        width: min(90%, 260px);
        height: auto;
        border-radius: 12px;
        border: 4px solid #d9d9d9;
        box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    }

    .name {
        margin-top: 15px;
        font-size: clamp(20px, 3vw, 26px);
        font-weight: 600;
        color: #222;
    }

    .role-box {
        margin-top: 15px;
        background: linear-gradient(90deg, #d62828, #f6aa1c);
        padding: 10px;
        font-weight: 700;
        border-radius: 6px;
        color: white;
        font-size: clamp(14px, 2.5vw, 18px);
    }

    .info-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 5px;
        font-size: clamp(14px, 2.5vw, 16px);
    }

    .info-table td {
        padding: 10px;
        border-bottom: 1px solid #e6e6e6;
    }

    .label {
        font-weight: 600;
        width: 35%;
        background: #f3f3f3;
        color: #444;
    }

    .value {
        color: #222;
    }

    .section-title {
        margin-top: 20px;
        font-weight: 700;
        color: #c01818;
        font-size: clamp(16px, 3vw, 20px);
    }
</style>
</head>
<body>

<div class="page-container">

    <div class="header">
        <h1>Radhe Industries Pvt. Ltd — Identity Verification</h1>
    </div>

    <div class="card-box">

        <div class="left-panel">
            <img src="user-photo.jpg" alt="User Photo">
            <div class="name">Veerdhawal Yadav</div>
            <div class="role-box">CEO • Co-founder</div>
        </div>

        <div class="right-panel">

            <table class="info-table">
                <tr><td class="label">DOB</td><td class="value">12/06/2006</td></tr>
                <tr><td class="label">Blood Group</td><td class="value">A+</td></tr>
                <tr><td class="label">ID Number</td><td class="value">CEO0001</td></tr>
                <tr><td class="label">Contact No.</td><td class="value">9657148298 / 9322856117</td></tr>
            </table>

            <div class="section-title">Emergency Contacts</div>

            <table class="info-table">
                <tr><td class="label">Primary</td><td class="value">9657148298</td></tr>
                <tr><td class="label">Secondary</td><td class="value">9322856117</td></tr>
            </table>

        </div>
    </div>

</div>

</body>
</html>
